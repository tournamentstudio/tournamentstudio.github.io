name: Report a bug
description: Describe an incorrect result or a workflow that does not work.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. This is public: use fictional entrants and remove private notes, coordinates, and secrets from attachments. Report security defects through the private reporting link instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the screen or feature, the actual behavior, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I reproduce it?
      description: List the steps. For draw or standings problems, include the format, entrant count, rules, and a small fictional example.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Firefox 144 on Windows 11; live site or local commit"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error text or a safe sample
      description: Optional screenshots, exact error text, or a minimal fictional tournament. Keep a backup before changing the affected tournament.
